name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: procurement_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d procurement_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/procurement_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,observability,mcp,postgres]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Policy evals
        run: PYTHONPATH=src python evals/run_policy_evals.py
      - name: Agent behavior evals
        run: PYTHONPATH=src python evals/run_agent_evals.py --mode deterministic
      - name: Adversarial security evals
        run: PYTHONPATH=src python evals/run_security_evals.py --mode deterministic
