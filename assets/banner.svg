    <rect x="0" y="228" width="122" height="48" rx="12" stroke="#f59e0b" stroke-opacity=".7"/>
    <text x="61" y="257" text-anchor="middle" fill="#cbd5e1" stroke="none" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Human</text>
