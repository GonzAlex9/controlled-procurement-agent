    <rect x="0" y="76" width="122" height="48" rx="12" stroke="#8b5cf6" stroke-opacity=".65"/>
    <text x="61" y="105" text-anchor="middle" fill="#cbd5e1" stroke="none" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">AI + Tools</text>
    <path d="M61 124v28" stroke="#64748b"/><path d="m56 146 5 6 5-6" stroke="#64748b"/>
    <rect x="0" y="152" width="122" height="48" rx="12" stroke="#34d399" stroke-opacity=".65"/>
    <text x="61" y="181" text-anchor="middle" fill="#cbd5e1" stroke="none" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Policy Gate</text>
