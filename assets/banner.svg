  <text x="66" y="220" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">A production-minded enterprise AI workflow — not an autonomous spending bot.</text>
  <text x="66" y="274" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">TOOLS · STRUCTURED OUTPUT · POLICY GATES · EVALS · AUDIT · HUMAN-IN-THE-LOOP</text>
